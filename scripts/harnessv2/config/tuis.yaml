# TUI drivers. Ohmypi and Codex are implemented. Claude is not a stub.
tuis:
  out_of_scope:
    - claude
  implemented:
    - ohmypi
    - codex
  stubs:
    - grok
    - opencode
  ohmypi:
    enabled: true
    binary: omp
    wrapper: ompla
    version_min: "17.3.8"
    env:
      PI_CONFIG_FILES: "{home}/.omp/agent/litellm-alpha.yml"
    cwd: /tmp/omp-alpha-workspace
    session_dir: /tmp/omp-alpha-sessions
    overlay: "{home}/.omp/agent/litellm-alpha.yml"
    # Ohmypi `task.agent` profiles for harness children (H-7). Staged into
    # `{cwd}/.omp/agents` so spawn is `agent=basic`, not `model=basic`.
    bundled_agents_dir: "{config_dir}/ohmypi-agents"
    project_agents_dir: "{cwd}/.omp/agents"
    orchestration_child_agents:
      - basic
      - basic-other
      - work
      - work-other
      - expert
      - expert-other
      - sota
      - sota-xai
      - sota-alibaba
      - sota-moonshot
      - sota-zai
      - auto-review
      - auto-review-other
    tmux:
      socket: tmux37
      session: omp-alpha-test
      harness_session_prefix: hv2-ohmypi
      wait_ready_seconds: 25
      wait_idle_seconds: 90
      wait_reply_seconds: 420
      wait_mcp_seconds: 30
      poll_interval_seconds: 1
    forbid_flags:
      - "-p"
      - "--print"
    argv_interactive:
      - omp
      - --session-dir
      - "{session_dir}"
    argv_launch_model:
      - omp
      - --session-dir
      - "{session_dir}"
      - --model
      - "{lane}/{model}"
    argv_no_tools:
      - --no-tools
    catalog_json_argv:
      - omp
      - models
      - --json
    catalog_find_argv:
      - omp
      - models
      - find
      - "{pattern}"
      - --json
    lanes:
      alias: litellm-alpha-passthrough
      completions: litellm-alpha
    model_id_template: "{lane}/{model}"
    spawn_prefix: litellm-alpha-passthrough
    # Dedicated tmux launch with --model. Never reuse leftover omp-alpha-test
    # panes and never use -p/--print.
    select_model:
      strategy: launch_session
      reuse_operator_session: false
      tools_for_model: false
      tools_for_orchestration: true
      ready_needles:
        - "π"
      mcp_ready_needles:
        - "Connected to MCP"
        - "No MCP"
      idle_needles:
        - "╰─"
        - "π  >"
        - "Default model:"
      # In-flight chrome only. Launch splash (Welcome back / Recent
      # sessions / Connecting to MCP / Discovering available models)
      # stays in tmux scrollback after the prompt footer returns.
      busy_needles:
        - Thinking
        - Working
        - Streaming
        - "Waiting For Remaining"
        - "all running jobs"
        - "Background job"
      selected_needles:
        - "{selector}"
        - "Default model: {selector}"
        - "AAWM alias {model}"
        # Long alias ids can paint this truncated chrome. Not a bare {model}
        # needle: "work" is a substring of "work-other".
        - "AAWM alias / model {model}"
        # OhMyPi 17.4.2 header chrome. The following " >" keeps "work"
        # from matching "work-other".
        - "╭── π  > ⬢ {model} >"
      # Recap is wait-only. Exact PONG is NOT a substring wait needle:
      # recent-session titles can contain the word PONG. Live PONG is a
      # standalone exact pane line after a prompt echo newer than the
      # pre-send watermark (H-6 / `_pane_exact_pong`).
      reply_needles:
        - "※ recap:"
        - "No endpoints found for"
        - "404 Not Found"
        - "status code 404"
        - "Error: 404"
      provider_404_needles:
        - "No endpoints found for"
        - "404 Not Found"
        - "status code 404"
        - "Error: 404"
      # Must not be a substring of the pasted orchestration prompt
      # (omp-alpha-fanout lives in orchestration.txt and would false-complete).
      orchestration_pass_needles:
        - "※ recap:"
      reject_needles:
        - no-model
        - "Warning: Model"
        - "Error: No model selected"
      env_keys:
        - PATH
        - HOME
        - USER
        - LOGNAME
        - TERM
        - COLORTERM
        - TMPDIR
        - LANG
        - LC_ALL
        - LC_CTYPE
        - PI_CONFIG_FILES
        - AAWM_HARNESS_USER_ID
  # Interactive Codex TUI. Never `codex exec`, never `-p`/`--print` (Codex
  # `-p` is `--profile`; harness uses `-c model_provider=` instead).
  # Default live surface is native `basic` only.
  codex:
    enabled: true
    binary: codex
    version_min: "0.142.5"
    cwd: /tmp/hv2-codex-workspace
    session_dir: /tmp/hv2-codex-sessions
    default_models:
      - basic
    default_orchestration_parent: basic
    default_orchestration_children: []
    model_prompt: codex_model
    orchestration_prompt: codex_orchestration
    identity:
      client: Codex
      client_name: Codex
      repository: litellm
      providers:
        - litellm-alpha
      headers:
        x-aawm-client: Codex
        x-aawm-client-name: Codex
        x-aawm-repository: litellm
        langfuse_trace_name: codex
      header_override: 'model_providers.{provider}.http_headers.{header}="{value}"'
      model_provider_override: 'model_provider="{lane}"'
    # Unattended interactive TUI: never `codex exec` / `-p`. These `-c`
    # overrides keep guardian/on-request from blocking the child `date`/`pwd`.
    extra_c_overrides:
      - 'approval_policy="never"'
      - 'sandbox_mode="workspace-write"'
      - 'features.guardian_approval=false'
      - 'projects."{cwd}".trust_level="trusted"'
    tmux:
      socket: tmux37
      session: codex
      harness_session_prefix: hv2-codex
      wait_ready_seconds: 25
      wait_idle_seconds: 180
      wait_reply_seconds: 600
      wait_mcp_seconds: 30
      # Extra floor for a nux that appears after selected chrome. Loading
      # chrome keeps polling until wait_ready_seconds; prompt-free panes
      # that already show the selected model skip Enter immediately.
      wait_trust_seconds: 4
      poll_interval_seconds: 1
    forbid_flags:
      - "-p"
      - "--print"
      - "--profile"
    forbid_tokens:
      - exec
    # Codex 0.149 maps Enter to composer newline. Submit is Ctrl-M
    # (`C-m`). Immediate C-m after paste-buffer is ignored until the
    # composer finishes ingesting the paste, so wait this many seconds
    # first. Never send this into the leftover operator `codex` pane.
    submit_keys:
      - C-m
    submit_delay_seconds: 1.0
    argv_interactive:
      - codex
      - --cd
      - "{cwd}"
    argv_launch_model:
      - codex
      - --cd
      - "{cwd}"
      - --model
      - "{model}"
    argv_no_tools: []
    lanes:
      alias: litellm-alpha
    model_id_template: "{model}"
    select_model:
      strategy: launch_session
      reuse_operator_session: false
      tools_for_model: true
      tools_for_orchestration: true
      pass_mode: tool_command
      standalone_pass_tokens:
        - hv2-codex-child
      ready_needles:
        - Codex
        - codex
      mcp_ready_needles: []
      idle_needles:
        - ">"
      busy_needles:
        - Thinking
        # Match `• Working (18s • esc to interrupt)`, not leftover trust-nux
        # `Working with untrusted contents` still in capture-pane scrollback.
        - "Working ("
        - Streaming
        - "Waiting For Remaining"
        - "all running jobs"
        - "Background job"
      # Footer `{alias} default` is not selected. Wait for the latest
      # `model:` header to leave `loading` and show `{alias}` / `{alias} xhigh`.
      selected_needles:
        - "{selector}"
        - "{model}"
      reply_needles:
        - hv2-codex-child
        - "No endpoints found for"
        - "404 Not Found"
        - "status code 404"
        - "Error: 404"
      provider_404_needles:
        - "No endpoints found for"
        - "404 Not Found"
        - "status code 404"
        - "Error: 404"
      orchestration_pass_needles:
        - hv2-codex-child
      reject_needles:
        - "Error: No model selected"
        - "Unknown model"
      # First launch into a fresh cwd shows the directory-trust nux.
      # Dedicated harness sessions auto-accept it (Enter on "Yes, continue").
      # Never send this into the leftover operator `codex` pane.
      trust_prompt_needles:
        - "Do you trust the contents of this directory?"
        - "Yes, continue"
      env_keys:
        - PATH
        - HOME
        - USER
        - LOGNAME
        - TERM
        - COLORTERM
        - TMPDIR
        - LANG
        - LC_ALL
        - LC_CTYPE
        - AAWM_HARNESS_USER_ID
  grok:
    enabled: false
    stub: true
  opencode:
    enabled: false
    stub: true
