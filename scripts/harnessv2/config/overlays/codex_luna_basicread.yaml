# Minimal Codex overlay: gpt-5.6-luna parent dispatches the basicread agent.
# Use with:
#   python scripts/harnessv2/run.py --instance litellm-alpha --tui codex \
#     --test orchestration --overlay scripts/harnessv2/config/overlays/codex_luna_basicread.yaml
# Unknown model tokens are treated as concrete ids (operator overlay).
# Host Codex currently ships ~/.codex/agents/readbasic.toml, not basicread.toml;
# this overlay still names the OBJECTIVE/AC4 child `basicread`.
models:
  compiled_aliases:
    - gpt-5.6-luna
    - basicread
  groups:
    luna_basicread_parent:
      - gpt-5.6-luna
    luna_basicread_children:
      - basicread
prompts:
  codex_luna_basicread:
    file: prompts/codex_luna_basicread.txt
tuis:
  codex:
    default_orchestration_parent: gpt-5.6-luna
    default_orchestration_children:
      - basicread
    orchestration_prompt: codex_luna_basicread
