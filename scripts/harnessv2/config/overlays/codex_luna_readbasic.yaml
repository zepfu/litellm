# Minimal Codex overlay: gpt-5.6-luna parent dispatches the readbasic agent.
# Use with:
#   python scripts/harnessv2/run.py --instance litellm-alpha --tui codex \
#     --test orchestration --overlay scripts/harnessv2/config/overlays/codex_luna_readbasic.yaml
# Unknown model tokens are treated as concrete ids (operator overlay).
# Host Codex ships ~/.codex/agents/readbasic.toml; `basicread` was a typo.
models:
  compiled_aliases:
    - gpt-5.6-luna
    - readbasic
  groups:
    luna_readbasic_parent:
      - gpt-5.6-luna
    luna_readbasic_children:
      - readbasic
prompts:
  codex_luna_readbasic:
    file: prompts/codex_luna_readbasic.txt
tuis:
  codex:
    default_orchestration_parent: gpt-5.6-luna
    default_orchestration_children:
      - readbasic
    orchestration_prompt: codex_luna_readbasic
