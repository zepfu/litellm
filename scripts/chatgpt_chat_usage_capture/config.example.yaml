# Example ChatGPT ordinary Chat usage collector configuration.
# This is a required shape, not a live account. Null windows are deliberate.
schema_version: 1

application:
  name: chatgpt-chat-usage-capture
  report_timezone: America/New_York
  database_path: ./state/usage.sqlite
  bind_host: 127.0.0.1
  bind_port: 8765
  local_api_auth: required
  local_api_token: local-dev
  persist_message_content: false
  outbound_notifications_enabled: false

accounts:
  - id: personal-primary
    enabled: true
    provider: openai
    expected_provider_user_id: null
    expected_workspace_id: null
    quota_owner_id: personal-primary
    surface: chat
    plan_policy_id: pro200-chat-2026-09-05
    browser:
      adapter: fixture_history
      profile_path: ./state/browser/personal-primary
      headless: false
      allow_interactive_login: true
    scheduler:
      refresh_interval: PT1H
      reconciliation_interval: PT24H
      jitter_seconds: 60
      catch_up: coalesce
      refresh_on_startup: if_due
      overlap_duration: PT48H
      initial_backfill_duration: P14D
      reconciliation_lookback: P14D
    collection:
      include_archived: true
      include_projects: true
      require_surface_evidence: true
      request_gap_ms: 1000
      request_timeout_seconds: 30
      max_http_attempts_per_run: 500
      max_run_seconds: 1200
      max_pages_per_conversation_per_run: 100
      observe_quota_metadata: true

accounting:
  working_estimator: requested_if_known_else_recorded_final
  count_only_generation_started_or_completed: true
  uncertain_attempts_in_working_estimate: false
  include_unknown_surface_in_chat: false
  missing_quota_window_behavior: show_activity_only
  boundary_convention: start_inclusive_end_exclusive

model_mapping:
  version: initial-unmapped
  canonical_families:
    - astra_pro
    - sol_pro
    - other_chat
    - unknown
  exact_rules: []
  unknown_behavior: preserve_and_report

quota_policies:
  - id: pro200-chat-2026-09-05
    status: documented_seed_requires_account_verification
    surface: chat
    buckets:
      - id: astra_weekly
        families: [astra_pro]
        capacity: 200
        unit: message
        documented_period_hint: week
        membership: union_once_per_attempt
        window: {type: unknown}
      - id: sol_daily
        families: [sol_pro]
        capacity: 170
        unit: message
        documented_period_hint: day
        membership: union_once_per_attempt
        window: {type: unknown}
      - id: pro_combined_daily
        families: [astra_pro, sol_pro]
        membership: union_once_per_attempt
        capacity: 200
        unit: message
        documented_period_hint: day
        window: {type: unknown}

retention:
  sanitized_observation_days: 45
  normalized_attempt_days: 180
  daily_aggregate_days: 400
  preserve_active_window_evidence: true
  raw_payload_storage: disabled

alerts:
  threshold_percentages: [75, 90, 100]
  unknown_mapping: true
  model_mismatch: true
  auth_required: true
  incomplete_history: true
  stale_soft_multiplier: 2
  stale_hard_multiplier: 6
  stale_grace_minutes: 5
  deduplicate_per_window_and_threshold: true

reporting:
  default_lookback: P7D
