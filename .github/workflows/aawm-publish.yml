name: Build and publish AAWM fork image
on:
  push:
    tags:
      - 'v*-aawm.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zepfu/litellm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Ensure tagged commit is on main
        run: |
          git fetch origin main --depth=1
          git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build runtime base image
        id: base_image
        run: |
          IMAGE_TAG="litellm-runtime-test:${GITHUB_SHA}"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          docker build -t "$IMAGE_TAG" .

      - name: Build AAWM addon wheels
        id: addon_wheels
        run: |
          python -m pip install --quiet build
          rm -rf .wheel-build/dist .control-plane-wheel-build/dist
          python -m build --wheel --outdir .wheel-build/dist .wheel-build
          python -m build --wheel --outdir .control-plane-wheel-build/dist .control-plane-wheel-build
          shopt -s nullglob
          CALLBACK_WHEELS=(.wheel-build/dist/*.whl)
          CONTROL_PLANE_WHEELS=(.control-plane-wheel-build/dist/*.whl)
          if [ "${#CALLBACK_WHEELS[@]}" -ne 1 ] || [ "${#CONTROL_PLANE_WHEELS[@]}" -ne 1 ]; then
            echo "Expected exactly one callback and one control-plane wheel" >&2
            printf "callback wheels: %s\n" "${CALLBACK_WHEELS[@]}"
            printf "control-plane wheels: %s\n" "${CONTROL_PLANE_WHEELS[@]}"
            exit 1
          fi
          CALLBACK_WHEEL="${CALLBACK_WHEELS[0]}"
          CONTROL_PLANE_WHEEL="${CONTROL_PLANE_WHEELS[0]}"
          echo "callback_wheel=$CALLBACK_WHEEL" >> "$GITHUB_OUTPUT"
          echo "control_plane_wheel=$CONTROL_PLANE_WHEEL" >> "$GITHUB_OUTPUT"

      - name: Validate runtime image installs local wheels
        run: |
          BASE_IMAGE="${{ steps.base_image.outputs.tag }}"
          VALIDATION_IMAGE="litellm-runtime-validate:${GITHUB_SHA}"
          SMOKE_DIR="/tmp/d1-575-smoke-${GITHUB_SHA}"
          mkdir -p "$SMOKE_DIR"
          mkdir -p "$SMOKE_DIR/wheels"
          cp "${{ steps.addon_wheels.outputs.callback_wheel }}" "$SMOKE_DIR/wheels/"
          cp "${{ steps.addon_wheels.outputs.control_plane_wheel }}" "$SMOKE_DIR/wheels/"
          cat >"$SMOKE_DIR/Dockerfile" <<EOF
          FROM ${BASE_IMAGE}
          WORKDIR /tmp
          RUN mkdir -p /tmp/wheels
          COPY wheels/*.whl /tmp/wheels/
          RUN python3 -m pip install --no-cache-dir --no-deps /tmp/wheels/*.whl \
            && rm -rf /tmp/wheels
          EOF
          docker build -t "$VALIDATION_IMAGE" -f "$SMOKE_DIR/Dockerfile" "$SMOKE_DIR"
          docker run --rm --workdir /tmp -i --entrypoint python3 "$VALIDATION_IMAGE" - <<'PY'
          from importlib import import_module
          from importlib.metadata import version
          import os
          import shutil

          def assert_not_under_app(module_name: str) -> None:
              module = import_module(module_name)
              module_file = os.path.realpath(getattr(module, "__file__", ""))
              if not module_file:
                  raise SystemExit(f"{module_name} has no source path")
              print(f"{module_name}: {module_file}")
              if module_file.startswith('/app/'):
                  raise SystemExit(f"{module_name} resolved to /app source path: {module_file}")

          print(f"litellm version: {version('litellm')}")
          print(f"aawm-litellm-callbacks version: {version('aawm-litellm-callbacks')}")
          print(f"aawm-litellm-control-plane version: {version('aawm-litellm-control-plane')}")

          assert_not_under_app('litellm')
          assert_not_under_app('aawm_litellm_callbacks')
          assert_not_under_app('aawm_litellm_callbacks.agent_identity')
          assert_not_under_app('litellm.proxy.pass_through_endpoints.aawm_claude_control_plane')

          import asyncpg  # noqa: F401
          from litellm.proxy.proxy_server import app  # noqa: F401

          if shutil.which('litellm') is None:
              raise SystemExit('litellm CLI is not discoverable')

          if not (os.path.isfile('/app/docker/prod_entrypoint.sh') and os.access('/app/docker/prod_entrypoint.sh', os.X_OK)):
              raise SystemExit('prod_entrypoint.sh missing or not executable')

          print('smoke test passed')
          PY

      - name: Push prebuilt image
        run: |
          docker tag "${{ steps.base_image.outputs.tag }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker tag "${{ steps.base_image.outputs.tag }}" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AAWM LiteLLM fork ${{ steps.version.outputs.version }}" \
            --notes "$(cat <<'EOF'
          AAWM LiteLLM fork image release.

          **Container images:**
          - `ghcr.io/zepfu/litellm:${{ steps.version.outputs.version }}`
          - `ghcr.io/zepfu/litellm:latest`
          EOF
          )"
