name: Validate model_prices_and_context_window.json

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-model-prices-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate model_prices_and_context_window.json
        run: |
          jq empty model_prices_and_context_window.json

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check OpenRouter capability table is up to date
        run: |
          python scripts/generate_openrouter_capability_table.py \
            --check \
            --source-date "$(git log -1 --format=%cs -- model_prices_and_context_window.json)"
