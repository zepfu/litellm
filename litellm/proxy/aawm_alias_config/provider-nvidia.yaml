# Provider-pinned acceptance alias (CFG-030). Closed NVIDIA NIM set.
# OpenRouter-namespace nvidia/nemotron-*:free stays on provider-openrouter.

defaults: {}

aliases:
  - name: provider-nvidia
    candidates:
      - provider: nvidia
        model: nvidia/openai/gpt-oss-20b
        route_family: codex_nvidia_completion_adapter
        priority: 100

      - provider: nvidia
        model: nvidia/deepseek-ai/deepseek-v4-flash-0731
        route_family: codex_nvidia_completion_adapter
        priority: 90

      - provider: nvidia
        model: nvidia/nvidia/nemotron-3-super-120b-a12b
        route_family: codex_nvidia_completion_adapter
        priority: 80

      - provider: nvidia
        model: nvidia/minimaxai/minimax-m3
        route_family: codex_nvidia_completion_adapter
        priority: 70

      - provider: nvidia
        model: nvidia/openai/gpt-oss-120b
        route_family: codex_nvidia_completion_adapter
        priority: 60
