# Provider-pinned acceptance alias (CFG-030). Closed NVIDIA NIM set.
# OpenRouter-namespace nvidia/nemotron-*:free stays on provider-openrouter.
# Retired models removed: gpt-oss-20b (2026-11-18), gpt-oss-120b (2026-09-03),
# deepseek-v4-flash-0731 (2026-09-21), nemotron-3-super-120b-a12b (2026-10-03),
# minimax-m3 (2026-09-09).

defaults: {}

aliases:
  - name: provider-nvidia
    candidates:
      - provider: nvidia
        model: nvidia/nvidia/nemotron-3.5-super-vl-120b-a12b
        route_family: codex_nvidia_completion_adapter
        priority: 100
