# Provider-pinned acceptance alias (CFG-029). Closed Z.AI Coding Plan set.
# One-model limitation: glm-5.2 on sota-zai is Alibaba Token Plan, not this
# provider. Codex-only route family; do not set anthropic_route_family.

defaults: {}

aliases:
  - name: provider-zai_coding_plan
    candidates:
      - provider: zai_coding_plan
        model: zai_coding_plan/glm-5.3-flash
        route_family: codex_zai_coding_plan_chat_completions_adapter
        priority: 100
        reasoning_effort: max
        schedule:
          start_time: "03:00:00"
          end_time: "23:00:00"
          timezone: "America/Los_Angeles"
