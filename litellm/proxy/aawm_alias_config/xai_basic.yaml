# Diagnostic xAI-first alias with an OpenAI/Codex last-resort tail.
defaults: {}

aliases:
  - name: xai_basic
    candidates:
      - provider: xai
        model: xai/grok-4.7
        route_family: codex_grok_native_responses_adapter
        priority: 100

      - provider: openai
        model: gpt-6-luna
        route_family: codex_responses
        priority: 0
        reasoning_effort: low
