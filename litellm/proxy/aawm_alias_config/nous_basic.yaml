# Diagnostic Nous-first alias with an OpenAI/Codex last-resort tail.
defaults: {}

aliases:
  - name: nous_basic
    candidates:
      - provider: nous
        model: nous/meituan/longcat-2.0:free
        route_family: codex_nous_chat_completions_adapter
        priority: 100

      - provider: openai
        model: gpt-5.6-luna
        route_family: codex_responses
        priority: 0
        reasoning_effort: low
