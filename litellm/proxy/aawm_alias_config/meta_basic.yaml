# Diagnostic Muse-first alias with an OpenAI/Codex last-resort tail.
defaults: {}

aliases:
  - name: meta_basic
    candidates:
      - provider: muse_code
        model: muse-spark-1.3-contributor
        route_family: muse_code
        priority: 100

      - provider: openai
        model: gpt-5.6-luna
        route_family: codex_responses
        priority: 0
        reasoning_effort: low
