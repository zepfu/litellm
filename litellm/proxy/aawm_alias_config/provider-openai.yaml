# Provider-pinned acceptance alias (CFG-029 / CFG-041). Closed OpenAI
# candidate set. Cheapest-first egress-validation order. Not an operational
# routing policy. Do not add these models to basic/work/expert/sota
# candidate order via this file.

defaults: {}

aliases:
  - name: provider-openai
    candidates:
      - provider: openai
        model: gpt-5.6-luna
        route_family: codex_responses
        priority: 100
        reasoning_effort: low

      - provider: openai
        model: gpt-5.6-terra
        route_family: codex_responses
        priority: 90
        reasoning_effort: low

      - provider: openai
        model: gpt-5.6-sol
        route_family: codex_responses
        priority: 0
        reasoning_effort: low
