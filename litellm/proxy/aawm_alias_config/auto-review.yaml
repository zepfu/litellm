# CFG-041: auto-review and codex-auto-review in one document.
# codex-auto-review is a public alias_reference into auto-review.
defaults: {}

aliases:
  - name: auto-review
    candidates:
      - alias_reference: auto-review-other
        priority: 100

      - provider: openai
        model: gpt-5.6-luna
        route_family: codex_responses
        priority: 90
        reasoning_effort: low

      - provider: openrouter
        model: openrouter/~deepseek/deepseek-v4-flash-latest
        route_family: codex_openrouter_completion_adapter
        priority: 0
        reasoning_effort: low

  - name: codex-auto-review
    candidates:
      - alias_reference: auto-review
        priority: 100
