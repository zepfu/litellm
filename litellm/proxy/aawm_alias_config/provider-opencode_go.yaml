# Provider-pinned acceptance alias (CFG-029). Closed OpenCode Go set.
# One-model limitation: only ox-alpha-free is on the compiled active routes.
# Codex-only route family; do not set anthropic_route_family.

defaults: {}

aliases:
  - name: provider-opencode_go
    candidates:
      - provider: opencode_go
        model: ox-alpha-free
        route_family: codex_opencode_go_adapter
        priority: 100
