defaults: {}

aliases:
  - name: sota
    # Logical sota only. Ohmypi (ompla) parents that need xAI / Moonshot /
    # Z.AI must request sota-xai, sota-moonshot, or sota-zai by name.
    # Do not add tui_family: ohmypi here; that would remap ompla's logical
    # sota away from the Codex-compatible default.
    dispatch:
      by_tui:
        - tui_family: codex
          target_alias: sota-openai
        - tui_family: grok
          target_alias: sota-xai
        - tui_family: qwen
          target_alias: sota-alibaba
        - tui_family: kimi
          target_alias: sota-moonshot
      default: sota-openai
      blocked_tui_families:
        - claude
