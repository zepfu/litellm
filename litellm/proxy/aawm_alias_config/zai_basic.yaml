# Diagnostic Z.AI-first alias with an OpenAI/Codex last-resort tail.
defaults: {}

aliases:
  - name: zai_basic
    candidates:
      - provider: zai_coding_plan
        model: zai_coding_plan/glm-5.3-flash
        route_family: codex_zai_coding_plan_chat_completions_adapter
        priority: 100

      - provider: openai
        model: gpt-6-luna
        route_family: codex_responses
        priority: 0
        reasoning_effort: low
