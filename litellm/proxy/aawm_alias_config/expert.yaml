# AAWM alias-routing config -- ``expert`` (CFG-013 / CFG-020).
# Nightly Alibaba Qwen 3.8 Max leads every ingress during 22:00-08:00 UTC+8.
# Outside that window Claude-origin requests lead with native Anthropic
# Opus 5, and every origin keeps OpenAI/Codex gpt-5.6-terra as the
# universal last resort:
#   - Nightly promotion: alibaba_token_plan/qwen3.8-max at priority 110.
#     This is a concrete leaf so sota-alibaba's Qwen 3.7 Max is not pulled
#     in. Closing the window prevents new affinity and does not evict an
#     existing session owner.
#   - Claude-origin requests only: native Anthropic claude-opus-5
#     (tui_attached: Claude). Canonical Opus 5 is inherently a 1M-context
#     model; there is no claude-opus-5[1m] selector because a second
#     selector would duplicate the same upstream model.
#   - Codex and every non-Claude/missing/unknown origin: gpt-5.6-terra is
#     the direct/default candidate outside the nightly window. Terra
#     carries no tui_excluded gate, so it also remains available to Claude
#     as the fallback after an Opus failure.
#
# All three compiled candidates carry authoritative ``reasoning_effort:
# max`` applied through the shared CFG-006 candidate pipeline.
#
# Compiled by config_compiler.compile_yaml() into an immutable RoutingSnapshot.
# priority: 0 is reserved for last-resort candidates and is always placed
# last in the compiled ordering.

defaults: {}

aliases:
  - name: expert
    candidates:
      # Nightly promotion (CFG-020): Qwen 3.8 Max is first for every ingress
      # during 22:00-08:00 UTC+8. This is a concrete leaf so sota-alibaba's
      # Qwen 3.7 Max last resort is not pulled in. The window is half-open
      # and does not evict an existing session owner.
      - provider: alibaba_token_plan
        model: alibaba_token_plan/qwen3.8-max
        route_family: codex_alibaba_token_plan_chat_completions_adapter
        priority: 110
        reasoning_effort: max
        schedule:
          start_time: "22:00:00"
          end_time: "08:00:00"
          utc_offset: "+08:00"

      # Claude-branch lead: native Anthropic Opus 5 only.
      # Anthropic-native credentials/egress on both ingress projections;
      # the Codex ingress excludes anthropic_messages candidates, so Opus
      # can never egress through Codex/OpenAI credentials.
      - provider: anthropic
        model: claude-opus-5
        route_family: anthropic_messages
        anthropic_route_family: anthropic_messages
        priority: 100
        reasoning_effort: max
        tui_attached: Claude

      # Universal last resort: direct/default candidate for Codex and every
      # non-Claude/missing/unknown origin, and still eligible for Claude
      # after an Opus failure. CFG-006: the configured max reasoning
      # replaces any caller-provided reasoning through the shared candidate
      # pipeline; Terra keeps its OpenAI/Codex credential domain on both
      # ingress projections.
      - provider: openai
        model: gpt-5.6-terra
        route_family: codex_responses
        priority: 0
        reasoning_effort: max
