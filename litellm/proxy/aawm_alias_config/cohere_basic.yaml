# Diagnostic Cohere-first alias with an OpenAI/Codex last-resort tail.
defaults: {}

aliases:
  - name: cohere_basic
    candidates:
      - provider: cohere
        model: cohere/north-mini-code-1-0
        route_family: codex_cohere_chat_completions_adapter
        priority: 100

      - provider: openai
        model: gpt-5.6-luna
        route_family: codex_responses
        priority: 0
        reasoning_effort: low
