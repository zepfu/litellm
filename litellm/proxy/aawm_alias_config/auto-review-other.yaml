# CFG-041: shared helper for auto-review alias.
defaults: {}

aliases:
  - name: auto-review-other
    candidates:
      - provider: alibaba_token_plan
        model: alibaba_token_plan/deepseek-v4-flash-0731
        route_family: codex_alibaba_token_plan_chat_completions_adapter
        priority: 100
        reasoning_effort: low
        schedule:
          start_time: "22:00:00"
          end_time: "08:00:00"
          utc_offset: "+08:00"

      - provider: zai_coding_plan
        model: zai_coding_plan/glm-5.3-flash
        route_family: codex_zai_coding_plan_chat_completions_adapter
        priority: 90
        reasoning_effort: low

      - provider: cursor_agent
        model: cursor_agent/composer-2.5
        route_family: codex_cursor_agent_aiserver_adapter
        priority: 80
        reasoning_effort: low
