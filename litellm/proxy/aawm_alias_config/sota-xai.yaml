defaults: {}

aliases:
  - name: sota-xai
    multi_agent_version: v2
    candidates:
      # Temporary: Cursor Grok lives on sota-cursor, not here.
      # Remaining Grok 4.7 order is native xAI OIDC, then managed xAI OAuth.
      # work / work-other inherit this order via alias_reference.
      - provider: xai
        model: xai/grok-4.7
        route_family: codex_grok_native_responses_adapter
        priority: 100

      - provider: xai
        model: oa_xai/grok-4.7
        route_family: codex_xai_oauth_responses_adapter
        priority: 90
