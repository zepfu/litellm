# CFG-041: shared helper for basic alias.
defaults: {}

aliases:
  - name: basic-other
    candidates:
      - provider: zai_coding_plan
        model: zai_coding_plan/glm-5.3-flash
        route_family: codex_zai_coding_plan_chat_completions_adapter
        priority: 170

      - provider: cohere
        model: cohere/north-mini-code-1-0
        route_family: codex_cohere_chat_completions_adapter
        priority: 160

      - provider: nous
        model: nous/meituan/longcat-2.0:free
        route_family: codex_nous_chat_completions_adapter
        priority: 150

      - provider: nvidia
        model: nvidia/moonshotai/kimi-k3-256k
        route_family: codex_nvidia_completion_adapter
        priority: 140

      - provider: openrouter
        model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
        route_family: codex_openrouter_completion_adapter
        priority: 130

      - provider: opencode_go
        model: omen-alpha
        route_family: codex_opencode_go_adapter
        priority: 120

      - provider: opencode_go
        model: muse-spark-1.3-contributor
        route_family: codex_opencode_go_adapter
        priority: 110

      - provider: alibaba_token_plan
        model: alibaba_token_plan/deepseek-v4.1-flash
        route_family: codex_alibaba_token_plan_chat_completions_adapter
        priority: 100
        schedule:
          start_time: "22:00:00"
          end_time: "08:00:00"
          utc_offset: "+08:00"

      - provider: cursor_agent
        model: cursor_agent/composer-2.5
        route_family: codex_cursor_agent_aiserver_adapter
        priority: 80
