# WSL-local dual-writer sidecar for native Grok OIDC and managed xAI OAuth.
#
# Owns only:
#   - /home/zepfu/.grok/auth.json (native Grok OIDC)
#   - /home/zepfu/.litellm/xai/oauth-auth.json (managed oa_xai/* OAuth)
# Do not put LiteLLM proxies, Codex, Kimi, or Alibaba writers here.
# Activate with scripts/ensure-wsl-grok-oidc-sidecar.sh --apply so both local
# LiteLLM proxies stay read-only consumers without recreate/restart.

name: aawm-wsl-grok-oidc

services:
  wsl-grok-oidc-refresh:
    image: aawm-provider-status-observations:prod
    # Override the default provider-status entrypoint so this unit never runs
    # front-door probes, DB writers, or unrelated credential refresh/poll tasks.
    # Reuses scripts/grok_oidc_refresh.py and scripts/xai_oauth_refresh.py from
    # the prod image for two independent credential families.
    entrypoint: ["python", "-u"]
    command:
      - -c
      - |
        import json, os, signal, time
        from datetime import datetime, timezone
        from pathlib import Path
        import scripts.grok_oidc_refresh as grok
        import scripts.xai_oauth_refresh as xai

        stopping = False

        def _stop(signum, frame):
            global stopping
            stopping = True

        signal.signal(signal.SIGINT, _stop)
        signal.signal(signal.SIGTERM, _stop)

        def env_str(name, default):
            value = os.getenv(name, default)
            return default if value is None or value == "" else value

        def env_int(name, default):
            raw = os.getenv(name)
            if raw is None or raw == "":
                return int(default)
            return int(raw)

        def env_bool(name, default):
            raw = os.getenv(name)
            if raw is None or raw == "":
                return bool(default)
            value = raw.strip().lower()
            if value in {"1", "true", "yes", "on"}:
                return True
            if value in {"0", "false", "no", "off"}:
                return False
            raise SystemExit(f"{name} must be a boolean")

        def emit(payload):
            payload = dict(payload)
            payload.setdefault("observed_at", datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"))
            payload.setdefault("environment", env_str("AAWM_LITELLM_ENVIRONMENT", "wsl-grok-oidc"))
            print(json.dumps(payload, sort_keys=True), flush=True)

        grok_auth_file = env_str("AAWM_GROK_OIDC_AUTH_FILE", "/home/zepfu/.grok/auth.json")
        grok_lock_file = env_str("AAWM_GROK_OIDC_LOCK_FILE", str(Path(grok_auth_file).with_name(Path(grok_auth_file).name + ".lock")))
        grok_interval = env_int("AAWM_GROK_OIDC_REFRESH_INTERVAL_SECONDS", 300)
        grok_buffer_seconds = env_int("AAWM_GROK_OIDC_REFRESH_BUFFER_SECONDS", 900)
        grok_force = env_bool("AAWM_GROK_OIDC_FORCE_REFRESH", False)
        grok_timeout = float(env_str("AAWM_GROK_OIDC_HTTP_TIMEOUT_SECONDS", "30"))

        xai_auth_file = env_str("AAWM_XAI_OAUTH_AUTH_FILE", "/home/zepfu/.litellm/xai/oauth-auth.json")
        xai_lock_file = env_str("AAWM_XAI_OAUTH_LOCK_FILE", str(Path(xai_auth_file).with_name(Path(xai_auth_file).name + ".lock")))
        xai_interval = env_int("AAWM_XAI_OAUTH_REFRESH_INTERVAL_SECONDS", 300)
        xai_buffer_seconds = env_int("AAWM_XAI_OAUTH_REFRESH_BUFFER_SECONDS", 900)
        xai_force = env_bool("AAWM_XAI_OAUTH_FORCE_REFRESH", False)
        xai_timeout = float(env_str("AAWM_XAI_OAUTH_HTTP_TIMEOUT_SECONDS", "30"))

        for name, interval in (
            ("AAWM_GROK_OIDC_REFRESH_INTERVAL_SECONDS", grok_interval),
            ("AAWM_XAI_OAUTH_REFRESH_INTERVAL_SECONDS", xai_interval),
        ):
            if interval <= 0:
                raise SystemExit(f"{name} must be > 0")
        for name, buffer_seconds in (
            ("AAWM_GROK_OIDC_REFRESH_BUFFER_SECONDS", grok_buffer_seconds),
            ("AAWM_XAI_OAUTH_REFRESH_BUFFER_SECONDS", xai_buffer_seconds),
        ):
            if buffer_seconds < 0:
                raise SystemExit(f"{name} must be >= 0")
        for name, timeout in (
            ("AAWM_GROK_OIDC_HTTP_TIMEOUT_SECONDS", grok_timeout),
            ("AAWM_XAI_OAUTH_HTTP_TIMEOUT_SECONDS", xai_timeout),
        ):
            if timeout <= 0:
                raise SystemExit(f"{name} must be > 0")

        cycle_interval = min(grok_interval, xai_interval)

        def repair_xai_metadata():
            auth_path = Path(xai_auth_file)
            lock_path = Path(xai_lock_file)
            with xai._credential_file_lock(lock_path):
                before = xai._snapshot_credential_file_metadata(auth_path)
                target = xai._resolve_credential_file_metadata(auth_path)
                repaired = before != target
                if repaired:
                    xai._apply_credential_file_metadata(auth_path, target)
                return {
                    "attempted": True,
                    "repaired": repaired,
                    "auth_file": str(auth_path),
                }

        emit({
            "event": "wsl_grok_oidc_refresh_started",
            "native_auth_file": grok_auth_file,
            "native_lock_file": grok_lock_file,
            "native_interval_seconds": grok_interval,
            "native_buffer_seconds": grok_buffer_seconds,
            "native_force_refresh": grok_force,
            "native_http_timeout_seconds": grok_timeout,
            "managed_auth_file": xai_auth_file,
            "managed_lock_file": xai_lock_file,
            "managed_interval_seconds": xai_interval,
            "managed_buffer_seconds": xai_buffer_seconds,
            "managed_force_refresh": xai_force,
            "managed_http_timeout_seconds": xai_timeout,
            "cycle_interval_seconds": cycle_interval,
        })

        while not stopping:
            cycle_started = time.monotonic()

            # Native Grok OIDC family (independent lock + events).
            try:
                repair = grok.repair_grok_oidc_auth_file_metadata(grok_auth_file, lock_file=grok_lock_file)
                if repair.get("repaired") or repair.get("error_class"):
                    emit({"event": "grok_oidc_metadata_repair", **repair})
            except Exception as exc:
                emit({
                    "event": "grok_oidc_metadata_repair",
                    "attempted": True,
                    "repaired": False,
                    "auth_file": grok_auth_file,
                    "error_class": exc.__class__.__name__,
                    "error_message": grok._sanitize_error_message(str(exc)),
                })
            try:
                summary = grok.refresh_grok_oidc_auth_file(
                    grok_auth_file,
                    buffer_seconds=grok_buffer_seconds,
                    force=grok_force,
                    lock_file=grok_lock_file,
                    http_timeout_seconds=grok_timeout,
                )
                emit({"event": "grok_oidc_refresh", **summary})
            except Exception as exc:
                emit({
                    "event": "grok_oidc_refresh",
                    "attempted": True,
                    "refreshed": False,
                    "skipped": False,
                    "auth_file": grok_auth_file,
                    "error_class": exc.__class__.__name__,
                    "error_message": grok._sanitize_error_message(str(exc)),
                })

            # Managed xAI OAuth family (independent lock + events).
            try:
                repair = repair_xai_metadata()
                if repair.get("repaired") or repair.get("error_class"):
                    emit({"event": "xai_oauth_metadata_repair", **repair})
            except Exception as exc:
                emit({
                    "event": "xai_oauth_metadata_repair",
                    "attempted": True,
                    "repaired": False,
                    "auth_file": xai_auth_file,
                    "error_class": exc.__class__.__name__,
                    "error_message": xai._sanitize_error_message(str(exc)),
                })
            try:
                summary = xai.refresh_xai_oauth_auth_file(
                    xai_auth_file,
                    buffer_seconds=xai_buffer_seconds,
                    force=xai_force,
                    lock_file=xai_lock_file,
                    http_timeout_seconds=xai_timeout,
                )
                emit({"event": "xai_oauth_refresh", **summary})
            except Exception as exc:
                emit({
                    "event": "xai_oauth_refresh",
                    "attempted": True,
                    "refreshed": False,
                    "skipped": False,
                    "auth_file": xai_auth_file,
                    "error_class": exc.__class__.__name__,
                    "error_message": xai._sanitize_error_message(str(exc)),
                })

            remaining = cycle_interval - (time.monotonic() - cycle_started)
            while remaining > 0 and not stopping:
                time.sleep(min(remaining, 1.0))
                remaining = cycle_interval - (time.monotonic() - cycle_started)

        emit({
            "event": "wsl_grok_oidc_refresh_stopped",
            "native_auth_file": grok_auth_file,
            "managed_auth_file": xai_auth_file,
        })
    container_name: aawm-wsl-grok-oidc-refresh
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      # Two independent writable credential directories only. No Codex/Kimi/Alibaba.
      - /home/zepfu/.grok:/home/zepfu/.grok
      - /home/zepfu/.litellm/xai:/home/zepfu/.litellm/xai
    environment:
      - AAWM_LITELLM_ENVIRONMENT=wsl-grok-oidc
      # Independent of provider-status DB writers / schema / PgBouncer.
      - AAWM_PROVIDER_STATUS_APPLY=0
      - AAWM_PROVIDER_STATUS_SETUP_SCHEMA_ON_START=0
      - AAWM_PROVIDER_STATUS_REQUIRE_PGBOUNCER=0
      - AAWM_PROVIDER_STATUS_SKIP_ICMP=1
      - AAWM_PROVIDER_STATUS_INTERVAL_SECONDS=300
      - AAWM_PROVIDER_STATUS_TIMEOUT=2
      - AAWM_PROVIDER_STATUS_PING_COUNT=1
      - AAWM_PROVIDER_STATUS_PING_TIMEOUT=2
      # Native Grok OIDC refresh (independent family on this WSL host).
      - AAWM_GROK_OIDC_REFRESH_ENABLED=1
      - AAWM_GROK_OIDC_AUTH_FILE=/home/zepfu/.grok/auth.json
      - AAWM_GROK_OIDC_LOCK_FILE=/home/zepfu/.grok/auth.json.lock
      - AAWM_GROK_OIDC_AUTH_FILE_UID=1000
      - AAWM_GROK_OIDC_AUTH_FILE_GID=1000
      - AAWM_GROK_OIDC_AUTH_FILE_MODE=0o600
      - AAWM_GROK_OIDC_REFRESH_INTERVAL_SECONDS=300
      - AAWM_GROK_OIDC_REFRESH_BUFFER_SECONDS=900
      - AAWM_GROK_OIDC_FORCE_REFRESH=0
      - AAWM_GROK_OIDC_HTTP_TIMEOUT_SECONDS=30
      # Managed xAI OAuth refresh (independent family; separate lock/events).
      - AAWM_XAI_OAUTH_REFRESH_ENABLED=1
      - AAWM_XAI_OAUTH_AUTH_FILE=/home/zepfu/.litellm/xai/oauth-auth.json
      - AAWM_XAI_OAUTH_LOCK_FILE=/home/zepfu/.litellm/xai/oauth-auth.json.lock
      - AAWM_XAI_OAUTH_AUTH_FILE_UID=0
      - AAWM_XAI_OAUTH_AUTH_FILE_GID=0
      - AAWM_XAI_OAUTH_AUTH_FILE_MODE=0o600
      - AAWM_XAI_OAUTH_REFRESH_INTERVAL_SECONDS=300
      - AAWM_XAI_OAUTH_REFRESH_BUFFER_SECONDS=900
      - AAWM_XAI_OAUTH_FORCE_REFRESH=0
      - AAWM_XAI_OAUTH_HTTP_TIMEOUT_SECONDS=30
      # Disable every other credential writer / poller on this dedicated unit.
      - AAWM_CODEX_OAUTH_REFRESH_ENABLED=0
      - AAWM_KIMI_OAUTH_REFRESH_ENABLED=0
      - AAWM_PROVIDER_AUTH_HEALTH_POLL_ENABLED=0
      - AAWM_KIMI_USAGE_POLL_ENABLED=0
      - AAWM_ALIBABA_QUOTA_POLL_ENABLED=0
      - AAWM_CODEX_RESET_CREDIT_POLL_ENABLED=0
      - AAWM_GROK_BILLING_POLL_ENABLED=0
      - AAWM_OBSERVABILITY_ANOMALY_SCAN_ENABLED=0
    healthcheck:
      # Combined credential/process health only. Never print or log token material.
      # Both native Grok OIDC and managed xAI OAuth records must be present, mode
      # 0600, hold access + refresh credentials, match expected client/scope, and
      # keep remaining lifetime well above LiteLLM's 300s near-expiry rejection
      # window (remaining > 600). Native requires issuer; managed may omit it.
      test:
        - CMD
        - python
        - -c
        - |
          import json
          import stat
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          scope = "https://auth.x.ai::b1a00492-073a-47ea-816f-4c329264a828"
          client = "b1a00492-073a-47ea-816f-4c329264a828"

          def remaining_ok(record):
              raw = str(record.get("expires_at") or "").strip()
              if not raw:
                  return False
              normalized = raw[:-1] + "+00:00" if raw.endswith("Z") else raw
              try:
                  expires = datetime.fromisoformat(normalized)
              except ValueError:
                  return False
              if expires.tzinfo is None:
                  expires = expires.replace(tzinfo=timezone.utc)
              remaining = (
                  expires.astimezone(timezone.utc) - datetime.now(timezone.utc)
              ).total_seconds()
              return remaining > 600

          def check(path, require_issuer):
              credential_path = Path(path)
              if not credential_path.is_file():
                  return False
              if stat.S_IMODE(credential_path.stat().st_mode) != 0o600:
                  return False
              try:
                  payload = json.loads(
                      credential_path.read_text(encoding="utf-8")
                  )
              except Exception:
                  return False
              if not isinstance(payload, dict):
                  return False
              record = payload.get(scope)
              if not isinstance(record, dict):
                  return False
              if not (record.get("key") or record.get("access_token")):
                  return False
              if not record.get("refresh_token"):
                  return False
              if (record.get("oidc_client_id") or record.get("client_id")) != client:
                  return False
              if (
                  require_issuer
                  and record.get("oidc_issuer") != "https://auth.x.ai"
              ):
                  return False
              return remaining_ok(record)

          healthy = check("/home/zepfu/.grok/auth.json", True) and check(
              "/home/zepfu/.litellm/xai/oauth-auth.json", False
          )
          sys.exit(0 if healthy else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
