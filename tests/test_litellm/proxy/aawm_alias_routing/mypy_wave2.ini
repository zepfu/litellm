[mypy]
plugins = pydantic.mypy
ignore_missing_imports = True
check_untyped_defs = True
show_error_codes = True

[mypy-litellm.proxy.pass_through_endpoints.llm_passthrough_endpoints]
# Existing god-module findings outside the bounded Wave 2 ranges. Runtime
# signature tests inspect the actual wrapper-bound callbacks; the extracted
# interfaces, candidate loop, and typed assignment fixture remain unsuppressed.
disable_error_code = attr-defined, assignment, arg-type
