[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aawm-litellm-callbacks"
version = "0.0.69"
description = "AAWM LiteLLM callback for Langfuse enrichment and session history"
requires-python = ">=3.10"
dependencies = ["litellm"]

[project.optional-dependencies]
dev = ["build"]

# Single-source packaging (RR-003 + RR-006):
# - force-include the canonical aawm_agent_identity package + aawm_session_history
#   package modules + sql shim under the litellm.integrations namespace so the
#   wheel-installed callback can import package-owned writer/sql/record and the
#   canonical agent_identity implementation without a dual-maintained copy
# The thin checkout loader under aawm_litellm_callbacks/agent_identity.py ships
# as-is and re-exports the canonical litellm.integrations.aawm_agent_identity
# namespace (including private helpers) at wheel build time.
#
# 0.0.69: immutable re-cut so the force-included aawm_session_history package
# carries the Codex review-decisions SQL surface that
# aawm_agent_identity/__init__.py imports (0.0.68 was cut before
# litellm/integrations/aawm_session_history/sql.py shipped those constants,
# leaving pip-overlay installs with an ImportError on proxy boot).
[tool.hatch.build.targets.wheel]
packages = ["aawm_litellm_callbacks"]

[tool.hatch.build.targets.wheel.force-include]
"../litellm/integrations/aawm_agent_identity/__init__.py" = "litellm/integrations/aawm_agent_identity/__init__.py"
"../litellm/integrations/aawm_agent_identity/constants.py" = "litellm/integrations/aawm_agent_identity/constants.py"
"../litellm/integrations/aawm_agent_identity/coerce.py" = "litellm/integrations/aawm_agent_identity/coerce.py"
"../litellm/integrations/aawm_agent_identity/cost_map.py" = "litellm/integrations/aawm_agent_identity/cost_map.py"
"../litellm/integrations/aawm_agent_identity/identity_tenant_agent.py" = "litellm/integrations/aawm_agent_identity/identity_tenant_agent.py"
